<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>註冊</title>
  <link rel="stylesheet" href="../assets/css/register.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div id="nav-placeholder"></div>
  <link rel="stylesheet" href="../assets/css/nav.css">
  <script src="../assets/js/nav.js"></script>

  <div class="register-container">
    <h1>註冊帳號</h1>

    <form class="register-form" onsubmit="register(event)">
      <label for="name">姓名</label>
      <input type="text" id="name" placeholder="請輸入姓名" required>

      <label for="username">使用者名稱</label>
      <input type="text" id="username" placeholder="請輸入使用者名稱" required>

      <label for="email">電子郵件</label>
      <input type="email" id="email" placeholder="example@gmail.com" required>

      <label for="password">密碼</label>
      <input type="password" id="password" placeholder="請輸入密碼" required>

      <label for="confirm-password">確認密碼</label>
      <input type="password" id="confirm-password" placeholder="請再次輸入密碼" required>

      <div class="btn-group">
        <button type="button" class="btn login-btn" onclick="goToLogin()">登入</button>
        <button type="submit" class="btn register-btn">註冊</button>
      </div>
    </form>

    <div id="result" style="margin-top:15px;color:green;"></div>
  </div>

  <script>
    function goToLogin() {
      window.location.href = "login.html";
    }

    async function register(event) {
      event.preventDefault(); // 阻止表單刷新

      const name = document.getElementById('name').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        alert("密碼與確認密碼不一致！");
        return;
      }

      // 前端送資料到 n8n Webhook
      try {
        const res = await fetch('http://localhost:5678/webhook/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name,
            username,
            email,
            password,
            confirmPassword
          })
        });

        const result = await res.json();

        if (result.success) {
            document.getElementById('result').innerText = result.message || "註冊成功";
            localStorage.setItem("loggedInUser", username || name);
            
            // 【新增】如果註冊回應有回傳 user_id，也要存起來
            if (result.user_id) {
                localStorage.setItem("user_id", result.user_id);
            }
            
            setTimeout(() => window.location.href = "index.html", 1500);
        } else {
          document.getElementById('result').innerText = result.message || "註冊失敗，請稍後再試";
        }

      } catch (err) {
        console.error(err);
        document.getElementById('result').innerText = '無法連接到伺服器';
      }
    }
  </script>
</body>
</html>
