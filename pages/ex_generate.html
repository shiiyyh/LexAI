<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>範本生成合約</title>
    <link rel="stylesheet" href="../assets/css/creat2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .file-upload-section {
            background: #2c3e50;
            border: 2px dashed #3498db;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .file-upload-section:hover {
            background: #34495e;
            border-color: #27ae60;
        }
        .file-upload-section i {
            font-size: 48px;
            color: #3498db;
            margin-bottom: 20px;
        }
        .file-upload-section h3 {
            color: #ecf0f1;
            margin-bottom: 10px;
        }
        .file-upload-section p {
            color: #bdc3c7;
            font-size: 14px;
        }
        .file-input-hidden {
            display: none;
        }
        .uploaded-file {
            background: #1a252f;
            border: 1px solid #34495e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ecf0f1;
        }
        .uploaded-file i {
            font-size: 24px;
            color: #27ae60;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>
    <link rel="stylesheet" href="../assets/css/nav.css">
    <script src="../assets/js/nav.js"></script>

    <main class="main-content">
        <h1 class="page-title">
            <span class="left-title">範本生成合約</span>
            <span class="editable-title" contenteditable="true" id="templateName">養殖生產設備買賣合約</span>
        </h1>

        <div class="container">

            <!-- 檔案內容區域 -->
            <div class="file-content-section" id="fileContentArea">
                <embed src="./採購合約範本.pdf" type="application/pdf" style="width: 900px; height: 600px; border: 1px solid #34495e; border-radius: 10px;">
            </div>

            <!-- 聊天區域 -->
            <div class="chat-section" id="chatSection">
                <div class="chat-message system-message">
                    <p>您好，我是合約生成助手。請告訴我您需要如何修改這份合約，我將為您生成新的版本。</p>
                </div>
            </div>

            <!-- 對方公司資訊查詢區域 -->
            <div class="counterparty-info-section">
                <div class="counterparty-header">
                    <h3><i class="fas fa-building"></i> 對方公司基本資料</h3>
                    <p class="section-desc">搜尋對方公司並自動帶入基本資訊</p>
                </div>
                <div class="counterparty-search">
                    <div class="search-form">
                        <div class="form-group">
                            <label for="counterpartyIdEx">統一編號</label>
                            <input 
                                type="text" 
                                id="counterpartyIdEx" 
                                placeholder="請輸入公司統編（例：12345678）"
                                class="search-input"
                            >
                        </div>
                        <button id="queryBtnEx" class="query-btn">
                            <i class="fas fa-search"></i> 查詢
                        </button>
                    </div>

                    <!-- 加載動畫 -->
                    <div id="counterpartyLoadingEx" class="loading-animation" style="display: none;">
                        <div class="spinner"></div>
                        <p id="counterpartyLoadingTextEx">正在連線商工登記資料庫...</p>
                    </div>

                    <!-- 查詢結果 -->
                    <div id="counterpartyResultsEx" class="counterparty-results" style="display: none;">
                        <div class="result-header">
                            <h4><i class="fas fa-check-circle"></i> 查詢結果</h4>
                            <button class="use-btn" id="useCounterpartyBtnEx">使用此資訊</button>
                        </div>
                        <div class="result-grid" id="counterpartyContentEx">
                            <!-- 結果會在此顯示 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 聊天輸入框區域 -->
            <div class="input-section">
                <div class="input-wrapper">
                    <input type="text" id="messageInput" class="text-input" placeholder="描述您需要的修改...按 Enter 送出">
                    <!-- 送出按鈕 -->
                    <button class="upload-btn" id="sendBtn" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <input type="file" id="templateFileInput" class="file-input-hidden" accept=".pdf,.docx,.doc,.txt">

    <script src="../assets/js/counterparty.js"></script>
    <script src="../assets/js/creat2-chat.js"></script>
    <script>
        // 取得 URL 參數中的範本名稱
        function getTemplateNameFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('template') || '養殖生產設備買賣合約';
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 設定範本名稱
            document.getElementById('templateName').textContent = getTemplateNameFromURL();

            // 初始化對方公司查詢功能
            setupCounterpartyListeners('Ex');
            
            // 載入導覽列
            fetch('nav.html')
                .then(res => res.text())
                .then(data => {
                    document.getElementById('nav-placeholder').innerHTML = data;
                    document.querySelectorAll('.toggle-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const sidebar = document.querySelector('.sidebar');
                            const mainContent = document.querySelector('.main-content');
                            if(sidebar) sidebar.classList.toggle('collapsed');
                            if(mainContent) mainContent.classList.toggle('collapsed');
                        });
                    });
                    
                    // 初始化登入狀態顯示
                    initAuth();
                })
                .catch(console.error);

            // 初始化聊天功能
            initializeChat();
        });

        // 初始化認證UI
        function initAuth() {
            const sidebarAuth = document.getElementById("sidebarAuth");
            if (!sidebarAuth) return;

            function renderAuthContent(user) {
                if (user) {
                    let userName = "使用者";
                    try {
                        const userData = JSON.parse(user);
                        userName = userData.name || "使用者";
                    } catch (e) {
                        userName = user;
                    }
                    return `
                        <div class="user-info">
                            <i class="fas fa-user-circle"></i>
                            <div class="sidebar-footer-name">${userName}</div>
                            <button id="logoutBtn" class="btn-logout">登出</button>
                        </div>
                    `;
                }
                return `
                    <div class="auth-links">
                        <button class="auth-toggle">
                            <i class="fas fa-user"></i>
                            <span>登入/註冊</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="auth-dropdown" id="authDropdown">
                            <a href="../pages/login.html" class="auth-option">登入</a>
                            <a href="../pages/register.html" class="auth-option">註冊</a>
                        </div>
                    </div>
                `;
            }

            function setupAuthDropdown() {
                const authToggle = sidebarAuth.querySelector('.auth-toggle');
                const authDropdown = document.getElementById('authDropdown');
                
                if (authToggle && authDropdown) {
                    const newAuthToggle = authToggle.cloneNode(true);
                    authToggle.parentNode.replaceChild(newAuthToggle, authToggle);
                    
                    newAuthToggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        authDropdown.classList.toggle('show');
                    });
                }
            }

            function updateAuthUI() {
                const user = localStorage.getItem("loggedInUser");
                sidebarAuth.innerHTML = renderAuthContent(user);

                if (user) {
                    const logoutBtn = document.getElementById("logoutBtn");
                    if (logoutBtn) {
                        logoutBtn.addEventListener("click", async () => {
                            localStorage.removeItem("loggedInUser");
                            alert("您已成功登出！");
                            window.location.href = "../pages/index.html";
                        });
                    }
                } else {
                    setupAuthDropdown();
                }

                document.addEventListener('click', () => {
                    const dropdown = document.getElementById('authDropdown');
                    if (dropdown) {
                        dropdown.classList.remove('show');
                    }
                });
            }

            updateAuthUI();

            window.addEventListener('storage', (e) => {
                if (e.key === 'loggedInUser') {
                    updateAuthUI();
                }
            });
        }

        // 檔案選擇
        function triggerFileSelect() {
            document.getElementById('templateFileInput').click();
        }

        document.getElementById('templateFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const uploadedFileDiv = document.getElementById('uploadedFile');
                const fileName = file.name;
                const fileSize = (file.size / 1024).toFixed(2); // 轉換為 KB

                uploadedFileDiv.innerHTML = `
                    <div class="uploaded-file">
                        <div style="display: flex; align-items: center;">
                            <i class="fas fa-file"></i>
                            <div>
                                <p style="margin: 0; font-weight: 600;">${fileName}</p>
                                <p style="margin: 5px 0 0 0; font-size: 12px; color: #95a5a6;">${fileSize} KB</p>
                            </div>
                        </div>
                        <button onclick="clearFile()" style="background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer;">
                            <i class="fas fa-trash"></i> 移除
                        </button>
                    </div>
                `;
                uploadedFileDiv.style.display = 'block';

                // 隱藏上傳提示
                document.querySelector('.file-upload-section').style.display = 'none';
            }
        });

        function clearFile() {
            document.getElementById('templateFileInput').value = '';
            document.getElementById('uploadedFile').innerHTML = '';
            document.getElementById('uploadedFile').style.display = 'none';
            document.querySelector('.file-upload-section').style.display = 'block';
        }

        // 發送訊息
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message) {
                const chatSection = document.getElementById('chatSection');
                
                // 添加用戶訊息
                const userMsg = document.createElement('div');
                userMsg.className = 'chat-message user-message';
                userMsg.innerHTML = '<p>' + message + '</p>';
                chatSection.appendChild(userMsg);
                
                // 清空輸入框
                input.value = '';
                
                // 模擬 AI 回應（可以連接到實際的 API）
                setTimeout(() => {
                    const aiMsg = document.createElement('div');
                    aiMsg.className = 'chat-message system-message';
                    aiMsg.innerHTML = '<p>已收到您的修改需求。系統正在生成新的合約版本...</p>';
                    chatSection.appendChild(aiMsg);
                    
                    // 新增修改完成訊息
                    setTimeout(() => {
                        const completedMsg = document.createElement('div');
                        completedMsg.className = 'chat-message system-message';
                        completedMsg.innerHTML = '<p>修改完成！</p><embed src="./採購合約範本_三萬.pdf" type="application/pdf" style="width: 900px; height: 600px; border: 1px solid #34495e; border-radius: 10px; margin-top: 10px;">';
                        chatSection.appendChild(completedMsg);
                        chatSection.scrollTop = chatSection.scrollHeight;
                    }, 1000);
                    
                    chatSection.scrollTop = chatSection.scrollHeight;
                }, 800);
                
                chatSection.scrollTop = chatSection.scrollHeight;
            }
        }

        // 回車送出
        document.addEventListener('DOMContentLoaded', function() {
            const messageInput = document.getElementById('messageInput');
            if (messageInput) {
                messageInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        sendMessage();
                    }
                });
            }
        });
    </script>

</body>
</html>
